<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Admin - AFC</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/svg+xml" href="../fotos/afc-logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .admin-container {
            padding: var(--spacing-lg);
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--color-border);
        }
        
        .admin-title {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        
        .admin-title h1 {
            margin: 0;
            color: var(--color-text);
        }
        
        .admin-actions {
            display: flex;
            gap: var(--spacing-md);
        }
        
        .btn-secondary {
            padding: var(--spacing-xs) var(--spacing-md);
            background: none;
            border: 1px solid var(--color-secondary);
            color: var(--color-secondary);
            border-radius: 4px;
            transition: var(--transition-normal);
        }
        
        .btn-secondary:hover {
            background: var(--color-secondary);
            color: var(--color-background);
        }
        
        .filters {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            flex-wrap: wrap;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }
        
        .filter-group label {
            font-weight: 500;
            margin: 0;
        }
        
        .filter-group select {
            padding: var(--spacing-xs) var(--spacing-sm);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            background: var(--color-background);
            color: var(--color-text);
        }
        
        .contact-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--color-background);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        
        .contact-table th,
        .contact-table td {
            padding: var(--spacing-sm);
            text-align: left;
            border-bottom: 1px solid var(--color-border);
        }
        
        .contact-table th {
            background: var(--color-primary);
            color: white;
            font-weight: 600;
        }
        
        .contact-table tr:hover {
            background: var(--color-background-alt);
        }
        
        .status-badge {
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
        }
        
        .status-new {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-read {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .status-replied {
            background: #d4edda;
            color: #155724;
        }
        
        .message-preview {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .actions {
            display: flex;
            gap: var(--spacing-xs);
        }
        
        .btn-small {
            padding: var(--spacing-xs);
            font-size: 0.875rem;
            border-radius: 4px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--color-overlay);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
        }
        
        .modal-content {
            background: var(--color-background);
            border-radius: 12px;
            padding: var(--spacing-lg);
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-sm);
            border-bottom: 1px solid var(--color-border);
        }
        
        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--color-text);
            padding: var(--spacing-xs);
            border-radius: 4px;
            transition: var(--transition-normal);
        }
        
        .close-modal:hover {
            background: var(--color-background-alt);
        }
        
        .contact-details {
            margin-bottom: var(--spacing-md);
        }
        
        .contact-details p {
            margin-bottom: var(--spacing-xs);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        
        .contact-details i {
            color: var(--color-secondary);
            width: 16px;
        }
        
        .message-content {
            background: var(--color-background-alt);
            padding: var(--spacing-md);
            border-radius: 8px;
            border-left: 4px solid var(--color-secondary);
            margin-top: var(--spacing-md);
        }
        
        .no-contacts {
            text-align: center;
            padding: var(--spacing-xl);
            color: var(--color-text-light);
        }
        
        .loading {
            text-align: center;
            padding: var(--spacing-xl);
            color: var(--color-text-light);
        }
        
        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                gap: var(--spacing-md);
                align-items: flex-start;
            }
            
            .filters {
                flex-direction: column;
                align-items: stretch;
            }
            
            .contact-table {
                font-size: 0.875rem;
            }
            
            .contact-table th,
            .contact-table td {
                padding: var(--spacing-xs);
            }
            
            .message-preview {
                max-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <div class="admin-title">
                <i class="fas fa-envelope"></i>
                <h1>Contact Requests Beheer</h1>
            </div>
            <div class="admin-actions">
                <a href="../index.html" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i>
                    Terug naar Website
                </a>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label for="status-filter">Status:</label>
                <select id="status-filter">
                    <option value="all">Alle</option>
                    <option value="new">Nieuw</option>
                    <option value="read">Gelezen</option>
                    <option value="replied">Beantwoord</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="sort-by">Sorteren op:</label>
                <select id="sort-by">
                    <option value="date-desc">Datum (nieuwste eerst)</option>
                    <option value="date-asc">Datum (oudste eerst)</option>
                    <option value="name-asc">Naam (A-Z)</option>
                    <option value="name-desc">Naam (Z-A)</option>
                </select>
            </div>
        </div>

        <div id="contacts-container">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                Contact requests laden...
            </div>
        </div>
    </div>

    <!-- Contact Detail Modal -->
    <div id="contact-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Contact Details</h2>
                <button class="close-modal" aria-label="Sluit modal">&times;</button>
            </div>
            <div id="modal-body">
                <!-- Contact details will be populated here -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const contactsContainer = document.getElementById('contacts-container');
            const statusFilter = document.getElementById('status-filter');
            const sortBy = document.getElementById('sort-by');
            const contactModal = document.getElementById('contact-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');
            const closeModal = document.querySelector('.close-modal');

            let allContacts = [];
            let filteredContacts = [];

            // Load contacts
            async function loadContacts() {
                try {
                    const response = await fetch('../php/get-contact-requests.php');
                    const data = await response.json();

                    if (data.success) {
                        allContacts = data.contact_requests;
                        filterAndDisplayContacts();
                    } else {
                        showError('Fout bij het laden van contact requests: ' + data.message);
                    }
                } catch (error) {
                    console.error('Error loading contacts:', error);
                    showError('Fout bij het laden van contact requests');
                }
            }

            function filterAndDisplayContacts() {
                const status = statusFilter.value;
                const sort = sortBy.value;

                // Filter by status
                filteredContacts = allContacts.filter(contact => {
                    if (status === 'all') return true;
                    return contact.status === status;
                });

                // Sort contacts
                filteredContacts.sort((a, b) => {
                    switch (sort) {
                        case 'date-desc':
                            return new Date(b.created_at) - new Date(a.created_at);
                        case 'date-asc':
                            return new Date(a.created_at) - new Date(b.created_at);
                        case 'name-asc':
                            return (a.first_name + ' ' + a.last_name).localeCompare(b.first_name + ' ' + b.last_name);
                        case 'name-desc':
                            return (b.first_name + ' ' + b.last_name).localeCompare(a.first_name + ' ' + a.last_name);
                        default:
                            return 0;
                    }
                });

                displayContacts();
            }

            function displayContacts() {
                if (filteredContacts.length === 0) {
                    contactsContainer.innerHTML = `
                        <div class="no-contacts">
                            <i class="fas fa-inbox"></i>
                            <p>Geen contact requests gevonden</p>
                        </div>
                    `;
                    return;
                }

                const tableHTML = `
                    <table class="contact-table">
                        <thead>
                            <tr>
                                <th>Naam</th>
                                <th>E-mail</th>
                                <th>Telefoon</th>
                                <th>Onderwerp</th>
                                <th>Bericht</th>
                                <th>Status</th>
                                <th>Datum</th>
                                <th>Acties</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filteredContacts.map(contact => `
                                <tr>
                                    <td>${contact.first_name} ${contact.last_name}</td>
                                    <td>${contact.email}</td>
                                    <td>${contact.phone || '-'}</td>
                                    <td>${contact.subject}</td>
                                    <td class="message-preview">${contact.message}</td>
                                    <td>
                                        <span class="status-badge status-${contact.status}">
                                            ${getStatusText(contact.status)}
                                        </span>
                                    </td>
                                    <td>${formatDate(contact.created_at)}</td>
                                    <td class="actions">
                                        <button class="btn btn-secondary btn-small" onclick="viewContact(${contact.id})">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                        <button class="btn btn-primary btn-small" onclick="markAsRead(${contact.id})">
                                            <i class="fas fa-check"></i>
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                contactsContainer.innerHTML = tableHTML;
            }

            function getStatusText(status) {
                switch (status) {
                    case 'new': return 'Nieuw';
                    case 'read': return 'Gelezen';
                    case 'replied': return 'Beantwoord';
                    default: return status;
                }
            }

            function formatDate(dateString) {
                const date = new Date(dateString);
                return date.toLocaleDateString('nl-NL', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }

            function showError(message) {
                contactsContainer.innerHTML = `
                    <div class="no-contacts">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>${message}</p>
                    </div>
                `;
            }

            // Global functions for table actions
            window.viewContact = function(contactId) {
                const contact = allContacts.find(c => c.id === contactId);
                if (!contact) return;

                modalTitle.textContent = `Contact van ${contact.first_name} ${contact.last_name}`;
                modalBody.innerHTML = `
                    <div class="contact-details">
                        <p><i class="fas fa-user"></i> <strong>Naam:</strong> ${contact.first_name} ${contact.last_name}</p>
                        <p><i class="fas fa-envelope"></i> <strong>E-mail:</strong> ${contact.email}</p>
                        ${contact.phone ? `<p><i class="fas fa-phone"></i> <strong>Telefoon:</strong> ${contact.phone}</p>` : ''}
                        <p><i class="fas fa-tag"></i> <strong>Onderwerp:</strong> ${contact.subject}</p>
                        <p><i class="fas fa-calendar"></i> <strong>Datum:</strong> ${formatDate(contact.created_at)}</p>
                        <p><i class="fas fa-info-circle"></i> <strong>Status:</strong> 
                            <span class="status-badge status-${contact.status}">${getStatusText(contact.status)}</span>
                        </p>
                    </div>
                    <div class="message-content">
                        <h3>Bericht:</h3>
                        <p>${contact.message.replace(/\n/g, '<br>')}</p>
                    </div>
                `;

                contactModal.style.display = 'flex';
            };

            window.markAsRead = function(contactId) {
                // This would typically update the status in the database
                // For now, we'll just update the local data
                const contact = allContacts.find(c => c.id === contactId);
                if (contact && contact.status === 'new') {
                    contact.status = 'read';
                    filterAndDisplayContacts();
                }
            };

            // Event listeners
            statusFilter.addEventListener('change', filterAndDisplayContacts);
            sortBy.addEventListener('change', filterAndDisplayContacts);

            closeModal.addEventListener('click', () => {
                contactModal.style.display = 'none';
            });

            window.addEventListener('click', (e) => {
                if (e.target === contactModal) {
                    contactModal.style.display = 'none';
                }
            });

            // Load contacts on page load
            loadContacts();
        });
    </script>
</body>
</html>
